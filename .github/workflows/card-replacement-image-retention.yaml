name: "Bench: Card Replacement Image Retention"

# Keeps the newest 30 versions of the nightly agent image in GHCR and deletes the
# rest. Older nights keep their results on bench; only re-running one of them
# needs its image. See card-replacement-agent/README.md, "Nightly benchmark".
# Manual for now (Actions > Run workflow); add a schedule to run it weekly.

on:
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: card-replacement-agent
          package-type: container
          min-versions-to-keep: 30
